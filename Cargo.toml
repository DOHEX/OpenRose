[workspace]
resolver = "2"
members = [
    "crates/headset",
    "xtask",
]
exclude = [
    "desktop/ext/*",
    "platform/windows/native",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
