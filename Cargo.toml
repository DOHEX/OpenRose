[workspace]
resolver = "2"
members = [
    "crates/circulation",
    "crates/control",
    "crates/desktop-platform",
    "crates/ffi",
    "crates/ffi-simulator",
    "crates/headset",
    "xtask",
]
exclude = [
    "desktop/ext/*",
    "platform/windows/native",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-util = "0.7"
async-trait = "0.1"
uniffi = { version = "0.32.2", default-features = false }

[profile.release]
panic = "unwind"
