style:
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/src/test/**', '**/src/*Test/**', '**/src/*TestFixtures/**']
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Test']
