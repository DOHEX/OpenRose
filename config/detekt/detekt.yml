# Overrides on top of detekt's default config (buildUponDefaultConfig); existing findings live in baseline/.
style:
  MaxLineLength:
    maxLineLength: 140
    # Test assertions and fixtures read better on one line; ktlint's wrapping rules still format them.
    excludes: ['**/src/test/**', '**/src/*Test/**', '**/src/*TestFixtures/**']
  ReturnCount:
    # Early returns that validate input are the idiomatic way to write protocol parsers.
    excludeGuardClauses: true
  MagicNumber:
    # Protocol frames, UI dimensions and tests are full of literal bytes and sizes.
    active: false
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    # Composables are PascalCase functions.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Composables take their state and callbacks as parameters.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Test']
