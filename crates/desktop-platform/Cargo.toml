[package]
name = "openrose-desktop-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openrose-circulation = { path = "../circulation" }
openrose-control = { path = "../control" }
openrose-headset = { path = "../headset" }
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process"] }
tokio-util.workspace = true
if-addrs = "0.15"
mdns-sd = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3"
serde.workspace = true
zbus = { version = "6.5.0", features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
