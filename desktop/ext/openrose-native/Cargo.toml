[package]
name = "openrose-native"
version = "0.1.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.7.0"
openrose-control = { path = "../../../crates/control", features = ["simulator"] }
openrose-desktop-platform = { path = "../../../crates/desktop-platform" }
openrose-headset = { path = "../../../crates/headset" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
