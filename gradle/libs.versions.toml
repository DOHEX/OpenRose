[versions]
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
android-buildTools = "37.0.0"
kotlin = "2.4.20"
agp = "9.5.0"
compose = "1.12.0"
# Overrides the Hot Reload 1.2.0 bundled with the Compose plugin, whose Gradle API use is deprecated for Gradle 10/11.
compose-hot-reload = "1.3.0-rc01"
material3 = "1.12.0-alpha03"
miuix = "0.9.4"
coroutines = "1.11.0"
immutable-collections = "0.4.0"
activity = "1.13.0"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
nucleus = "2.5.18"
composenativetray = "2.1.7"
robolectric = "4.17"
bluez-dbus = "0.3.5"
dbus-java = "5.2.0"
slf4j = "2.0.18"
serialization-json = "1.12.0"
# Code quality: detekt 2.x embeds Kotlin 2.4, which the 1.23 line cannot parse.
detekt = "2.0.0-alpha.6"
spotless = "8.11.0"
ktlint = "1.8.0"
kover = "0.9.11"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutable-collections" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-autolaunch = { module = "dev.nucleusframework:nucleus.autolaunch", version.ref = "nucleus" }
composenativetray-app = { module = "dev.nucleusframework:composenativetray-app", version.ref = "composenativetray" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
bluez-dbus = { module = "com.github.hypfvieh:bluez-dbus", version.ref = "bluez-dbus" }
dbus-java-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
nucleus = { id = "dev.nucleusframework", version.ref = "nucleus" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Convention plugins from build-logic.
openrose-kmp-library = { id = "openrose.kmp.library" }
openrose-kmp-compose-library = { id = "openrose.kmp.compose.library" }
openrose-jvm-library = { id = "openrose.jvm.library" }
openrose-desktop-application = { id = "openrose.desktop.application" }
openrose-android-application = { id = "openrose.android.application" }
