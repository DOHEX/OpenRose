[versions]
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
android-buildTools = "37.0.0"
kotlin = "2.4.21"
agp = "9.5.2"
compose = "1.12.2"
compose-hot-reload = "1.3.0-rc01"
material3 = "1.12.0-alpha03"
miuix = "0.9.4"
backdrop = "2.0.1"
coroutines = "1.11.0"
datetime = "0.8.0"
immutable-collections = "0.5.2"
activity = "1.13.0"
androidx-core = "1.18.0"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
nucleus = "2.5.18"
composenativetray = "2.1.7"
robolectric = "4.18.1"
bluez-dbus = "0.3.5"
