zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
jmdns = { module = "org.jmdns:jmdns", version = "3.6.5" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.87" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
