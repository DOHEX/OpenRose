[package]
name = "openrose-audio-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-collections = "0.2.0"
windows-core = "0.61.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDate",
    "CFRunLoop",
    "CFString",
] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-io-bluetooth = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "Bluetooth",
    "BluetoothAssignedNumbers",
    "IOBluetoothHandsFree",
    "IOBluetoothDevice",
    "IOBluetoothHostController",
    "IOBluetoothObject",
    "IOBluetoothSDPServiceRecord",
    "IOBluetoothSDPUUID",
    "IOBluetoothTypes",
    "IOBluetoothUserNotification",
] }
