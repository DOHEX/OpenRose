name: openrose
arch: amd64
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: "DOHEX <53633138+DOHEX@users.noreply.github.com>"
description: "Third-party control client for ROSE / ROSESELSA earphones"
vendor: "DOHEX"
homepage: "https://github.com/DOHEX/OpenRose"
license: "GPL-3.0-or-later"

contents:
  - src: desktop/.nsh/out/OpenRose/OpenRose
    dst: /usr/lib/io.github.dohex.openrose/OpenRose
    file_info:
      mode: 0755
  - src: desktop/.nsh/out/OpenRose/nsh/
    dst: /usr/lib/io.github.dohex.openrose/nsh
    type: tree
  - src: ../lib/io.github.dohex.openrose/OpenRose
    dst: /usr/bin/openrose
    type: symlink
  - src: packaging/linux/io.github.dohex.openrose.desktop
    dst: /usr/share/applications/io.github.dohex.openrose.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/openrose.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.dohex.openrose.png
    file_info:
      mode: 0644
  - src: desktop/.nsh/out/OpenRose/io.github.dohex.openrose.metainfo.xml
    dst: /usr/share/metainfo/io.github.dohex.openrose.metainfo.xml
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - bluez
      - libgtk-4-1 (>= 4.14)
      - libdbus-1-3
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libglib2.0-bin
      - libcairo2
      - libfontconfig1
      - libgraphene-1.0-0
      - libharfbuzz0b
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
  rpm:
    depends:
      - bluez
      - gtk4 >= 4.14
      - dbus-libs
      - gstreamer1
      - gstreamer1-plugins-base
      - glib2
      - cairo
      - fontconfig
      - graphene
      - harfbuzz
      - pango
  archlinux:
    depends:
      - bluez
      - gtk4>=4.14
      - dbus
      - gstreamer
      - gst-plugins-base-libs
      - glib2
      - cairo
      - fontconfig
      - graphene
      - harfbuzz
      - pango
