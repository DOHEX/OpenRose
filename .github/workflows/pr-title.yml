name: PR title

# release-please reads Conventional Commits from main to pick the version and write the changelog; PRs are
# squash-merged, so the PR title becomes the commit. A wrong type silently drops a change from the release notes.
# pull_request_target runs the workflow from main and checks nothing out, so fork PRs can be validated safely.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Types are the ones in release-please-config.json plus revert.
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            ci
            test
            style
            chore
            revert
