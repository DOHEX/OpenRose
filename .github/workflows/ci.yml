name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main pushes may carry a release; queue them instead of cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On main, opens or updates the release PR from Conventional Commits; merging it tags vX.Y.Z and drafts the
  # GitHub release. A tag pushed with GITHUB_TOKEN starts no workflow, so this run builds the release.
  # On every run, decides whether this is a release build and names the artifacts.
  release-please:
    name: Release PR and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5.0.0

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: version.txt
          sparse-checkout-cone-mode: false

      # The version itself comes from version.txt (build-logic AppVersion); a release only drops the -dev suffix.
      # Artifact names carry the version; non-release builds add -dev and the commit, since package files stay at the bare version.
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.release.outputs.tag_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$RELEASE_TAG" != "v$version" ]]; then
              echo "::error::Release tag $RELEASE_TAG does not match version.txt ($version)."
              exit 1
            fi
            label="$version"
          else
            label="$version-dev-${COMMIT_SHA::7}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Checkout release PR branch to sync Cargo and desktop versions
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          path: release-pr

      - name: Sync Cargo and desktop versions on release PR
        if: steps.release.outputs.pr != ''
        working-directory: release-pr
        env:
          PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          cargo xtask sync-version
          cargo xtask check-version
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update
            git commit -m 'chore: sync Cargo and desktop versions with version.txt'
            git push origin "HEAD:$PR_BRANCH"
          fi

  # Shared Rust, JVM and Android checks; independent of the release, so they start at once.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SKIKO_RENDER_API: SOFTWARE
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The JDK version comes from .mise.toml, the same pin developers use locally.
      - uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.5

      - name: Read Android SDK versions from the version catalog
        id: android-sdk
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          echo "platform=$(version android-compileSdk)" >> "$GITHUB_OUTPUT"
          echo "build-tools=$(version android-buildTools)" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-${{ steps.android-sdk.outputs.platform }}.0 build-tools;${{ steps.android-sdk.outputs.build-tools }}'

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-0t64 libegl1 libgl1 libfontconfig1 libdbus-1-dev pkg-config

      - name: Run checks
        run: cargo xtask check

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-checks
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Build (android)
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
      ORG_GRADLE_PROJECT_releaseBuild: ${{ needs.release-please.outputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.5

      - name: Read Android SDK versions from the version catalog
        id: android-sdk
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          echo "platform=$(version android-compileSdk)" >> "$GITHUB_OUTPUT"
          echo "build-tools=$(version android-buildTools)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(version android-ndk)" >> "$GITHUB_OUTPUT"
          echo "abis=$(version android-abis)" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-${{ steps.android-sdk.outputs.platform }}.0 build-tools;${{ steps.android-sdk.outputs.build-tools }} ndk;${{ steps.android-sdk.outputs.ndk }}'

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache cargo-ndk
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install Android Rust targets and cargo-ndk
        env:
          ABIS: ${{ steps.android-sdk.outputs.abis }}
        run: |
          targets=()
          for abi in $ABIS; do
            case "$abi" in
              arm64-v8a) targets+=(aarch64-linux-android) ;;
              armeabi-v7a) targets+=(armv7-linux-androideabi) ;;
              x86_64) targets+=(x86_64-linux-android) ;;
              x86) targets+=(i686-linux-android) ;;
              *) echo "::error::no Rust target for Android ABI $abi"; exit 1 ;;
            esac
          done
          rustup target add "${targets[@]}"
          if ! cargo ndk --version 2>/dev/null | grep -qx 'cargo-ndk 4\.1\.2'; then
            cargo install --locked cargo-ndk --version 4.1.2
          fi

      - name: Ensure autotools for patched JNA arm64 build
        run: |
          if ! command -v autoreconf >/dev/null 2>&1 || [[ ! -f /usr/share/aclocal/ltdl.m4 ]]; then
            sudo apt-get update
            sudo apt-get install --yes autoconf automake libtool libltdl-dev
          fi

      - name: Determine whether this PR changes the Android release package
        id: android-release-check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- androidApp platform/android shared crates Cargo.toml Cargo.lock \
            build-logic gradle build.gradle.kts settings.gradle.kts gradle.properties .github/workflows/ci.yml \
            > "$RUNNER_TEMP/android-inputs.txt"
          if [[ -s "$RUNNER_TEMP/android-inputs.txt" ]]; then echo 'required=true' >> "$GITHUB_OUTPUT"; fi

      - name: Build Android debug package
        if: env.RELEASE_TAG == '' && steps.android-release-check.outputs.required != 'true'
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug

      - name: Build Android debug package, check release lint and build unsigned release package
        if: steps.android-release-check.outputs.required == 'true'
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug :androidApp:lintRelease :androidApp:assembleRelease

      - name: Build signed Android release
        if: env.RELEASE_TAG != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENROSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENROSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENROSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TOOLS: ${{ steps.android-sdk.outputs.build-tools }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${OPENROSE_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${OPENROSE_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS repository secret}"
          : "${OPENROSE_KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD repository secret}"
          export OPENROSE_KEYSTORE_PATH="$RUNNER_TEMP/openrose-release.jks"
          trap 'rm -f "$OPENROSE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OPENROSE_KEYSTORE_PATH"
          ./gradlew --no-daemon --stacktrace :androidApp:assembleRelease
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify androidApp/build/outputs/apk/release/androidApp-release.apk

      # R8 and the resource shrinker cannot see reflective or by-name use; fail if they dropped any of it.
      - name: Check what R8 must keep
        if: env.RELEASE_TAG != '' || steps.android-release-check.outputs.required == 'true'
        env:
          BUILD_TOOLS: ${{ steps.android-sdk.outputs.build-tools }}
        run: |
          packages=(androidApp/build/outputs/apk/release/*.apk)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          apk="${packages[0]}"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          entry=$(unzip -p "$apk" META-INF/xposed/java_init.list)
          unzip -q -o "$apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          "$tools/dexdump" -l plain "$RUNNER_TEMP"/dex/classes*.dex > "$RUNNER_TEMP/classes.txt"
          awk -v entry="'L${entry//.//};'" '$1 == "Class" && $2 == "descriptor" && $4 == entry { found = 1 } END { exit !found }' "$RUNNER_TEMP/classes.txt" ||
            { echo "::error::Xposed entry $entry is missing from the release APK"; exit 1; }
          "$tools/aapt2" dump resources "$apk" > "$RUNNER_TEMP/resources.txt"
          for video in openrose_earbud_left openrose_earbud_right; do
            grep -q "raw/$video\$" "$RUNNER_TEMP/resources.txt" ||
              { echo "::error::raw/$video was shrunk out of the release APK"; exit 1; }
          done

      - name: Collect package
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          mkdir -p dist/android
          if [[ -n "$RELEASE_TAG" ]]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/android/openrose-$version-android.apk"
          else
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "dist/android/openrose-$version-android-debug.apk"
          fi
          ls -lR dist

      - name: Verify uncompressed native libraries in APK
        env:
          ABIS: ${{ steps.android-sdk.outputs.abis }}
          NDK_VERSION: ${{ steps.android-sdk.outputs.ndk }}
        run: |
          packages=(dist/android/*.apk)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          apk="${packages[0]}"
          for abi in $ABIS; do
            for name in libopenrose_ffi.so libjnidispatch.so; do
              lib="lib/$abi/$name"
              unzip -v "$apk" "$lib" | awk -v path="$lib" '$2 == "Stored" && $NF == path { found = 1 } END { exit !found }' ||
                { echo "::error::$lib is missing or compressed in $apk"; exit 1; }
            done
          done
          if [[ " $ABIS " == *" arm64-v8a "* ]]; then
            unzip -p "$apk" lib/arm64-v8a/libjnidispatch.so > "$RUNNER_TEMP/arm64-libjnidispatch.so"
            if "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" -d "$RUNNER_TEMP/arm64-libjnidispatch.so" | grep -Eq '\b[xw]18\b'; then
              echo "::error::lib/arm64-v8a/libjnidispatch.so in $apk references reserved register x18/w18"
              exit 1
            fi
          fi

      - name: Upload Android package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openrose-${{ needs.release-please.outputs.label }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-android
          path: '**/build/reports/lint-results*'
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Build (linux-x64)
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.5

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            desktop/ext/openrose-native -> target
          cache-directories: desktop/target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdbus-1-dev pkg-config

      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          cargo xtask package-linux
          ls -lR dist/desktop

      - name: Install deb package in clean ubuntu:24.04 container
        run: |
          docker run --rm -v "$PWD/dist/desktop:/pkg:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            (cd /pkg && apt-get install --yes ./openrose_*.deb)
            command -v openrose
            test -x "$(command -v openrose)"
            test -f /usr/share/applications/io.github.dohex.openrose.desktop
            test -f /usr/share/icons/hicolor/512x512/apps/io.github.dohex.openrose.png
          '

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openrose-${{ needs.release-please.outputs.label }}-linux-x64
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Attach packages to draft release
    needs: [release-please, checks, android, desktop]
    if: needs.release-please.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Sigstore signing certificate and attestation storage for the build provenance below.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: openrose-*
          path: dist
          merge-multiple: true

      # One digest per package; the file ships with the release so downloads can be checked without GitHub.
      - name: Write SHA256SUMS
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS dist/
          cat dist/SHA256SUMS

      # Signed SLSA provenance tying each package to this workflow run and commit; check with `gh attestation verify`.
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # release-please drafts the release with its changelog; a manually pushed tag gets a new draft.
      - name: Attach verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes --title "OpenRose $RELEASE_TAG"
          fi
