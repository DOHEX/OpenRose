name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main pushes may carry a release; queue them instead of cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Opens or updates the release PR from Conventional Commits; merging it tags vX.Y.Z and drafts the
  # GitHub release. A tag pushed with GITHUB_TOKEN starts no workflow, so this run builds the release.
  release-please:
    name: Release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build (${{ matrix.platform }})
    needs: release-please
    # release-please is skipped outside main pushes; build still runs then.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
    defaults:
      run:
        shell: bash
    env:
      SKIKO_RENDER_API: SOFTWARE
      # Set for a pushed release tag or a release that release-please just created; empty otherwise.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure release version
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_releaseVersion=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.11+10'

      # Nucleus drives electron-builder to turn the jpackage image into installers.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Read Android SDK versions from the version catalog
        if: runner.os == 'Linux'
        id: android-sdk
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          echo "platform=$(version android-compileSdk)" >> "$GITHUB_OUTPUT"
          echo "build-tools=$(version android-buildTools)" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: runner.os == 'Linux'
        with:
          packages: 'platform-tools platforms;android-${{ steps.android-sdk.outputs.platform }}.0 build-tools;${{ steps.android-sdk.outputs.build-tools }}'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Linux runtime libraries and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-0t64 libegl1 libgl1 libfontconfig1 rpm libarchive-tools

      # Tests run once, on Linux; each host packages only the formats it supports.
      - name: Run checks and build Android and Linux packages
        if: runner.os == 'Linux'
        run: >-
          ./gradlew --no-daemon --stacktrace
          check offlineCheck
          :androidApp:assembleDebug
          :desktopApp:packageDistributionForCurrentOS

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: ./gradlew --no-daemon --stacktrace :desktopApp:packageDistributionForCurrentOS

      - name: Build signed Android release
        if: env.RELEASE_TAG != '' && runner.os == 'Linux'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENROSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENROSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENROSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TOOLS: ${{ steps.android-sdk.outputs.build-tools }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${OPENROSE_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${OPENROSE_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS repository secret}"
          : "${OPENROSE_KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD repository secret}"
          export OPENROSE_KEYSTORE_PATH="$RUNNER_TEMP/openrose-release.jks"
          trap 'rm -f "$OPENROSE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OPENROSE_KEYSTORE_PATH"
          ./gradlew --no-daemon --stacktrace :androidApp:assembleRelease
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify androidApp/build/outputs/apk/release/androidApp-release.apk

      # R8 and the resource shrinker cannot see reflective or by-name use; fail if they dropped any of it.
      - name: Check what R8 must keep
        if: env.RELEASE_TAG != '' && runner.os == 'Linux'
        env:
          BUILD_TOOLS: ${{ steps.android-sdk.outputs.build-tools }}
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          entry=$(unzip -p "$apk" META-INF/xposed/java_init.list)
          unzip -q -o "$apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          "$tools/dexdump" -l plain "$RUNNER_TEMP"/dex/classes*.dex | grep -qF "'L${entry//.//};'" ||
            { echo "::error::Xposed entry $entry is missing from the release APK"; exit 1; }
          for video in openrose_earbud_left openrose_earbud_right; do
            "$tools/aapt2" dump resources "$apk" | grep -q "raw/$video\$" ||
              { echo "::error::raw/$video was shrunk out of the release APK"; exit 1; }
          done

      - name: Collect packages
        run: |
          mkdir -p dist
          collect() {
            local found
            found=$(find desktopApp/build/compose/binaries/main -mindepth 2 -maxdepth 2 -type f -name "$1")
            if [[ -z "$found" ]]; then
              echo "::error::No $1 package was built"
              exit 1
            fi
            cp $found dist/
          }
          if [[ "$RUNNER_OS" == Linux ]]; then
            for pattern in '*.deb' '*.rpm' '*.pacman' '*.AppImage'; do collect "$pattern"; done
            if [[ -n "$RELEASE_TAG" ]]; then
              cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/OpenRose-android.apk
            else
              cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/OpenRose-android-debug.apk
            fi
          else
            collect '*.msi'
          fi
          ls -l dist

      - name: Upload application packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test and lint reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.platform }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attach packages to draft release
    needs: [release-please, build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (github.ref_type == 'tag' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Sigstore signing certificate and attestation storage for the build provenance below.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      # One digest per package; the file ships with the release so downloads can be checked without GitHub.
      - name: Write SHA256SUMS
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS dist/
          cat dist/SHA256SUMS

      # Signed SLSA provenance tying each package to this workflow run and commit; check with `gh attestation verify`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # release-please drafts the release with its changelog; a manually pushed tag gets a new draft.
      - name: Attach verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes --title "OpenRose $RELEASE_TAG"
          fi
