name: 功能建议 / Feature request
description: 提出新功能、新型号支持或平台适配 / Suggest a feature, a new model, or platform support
title: "[Feature] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先阅读 [术语表](https://github.com/DOHEX/OpenRose/blob/main/GLOSSARY.md) 和 [架构决策记录](https://github.com/DOHEX/OpenRose/tree/main/docs/adr)，并尽量使用术语表中的用语。中文或英文均可。
        Please skim the glossary and the ADRs first and use the glossary's vocabulary where you can. Chinese or English is fine.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你想做什么、现在为什么做不到？请描述使用场景，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
      description: 期望的行为或界面。考虑过的替代方案也请写在这里。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及的平台 / Affected platforms
      multiple: true
      options:
        - Android
        - HyperOS 系统集成 (HyperOS integration)
        - Linux 桌面 (Linux desktop)
        - Windows 桌面 (Windows desktop)
        - 与平台无关 (Platform independent)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 涉及的耳机型号 / Earphone models
      description: 涉及新型号时请注明，并说明你能否提供真机用于验证。
      placeholder: 例如 EarFeel i7、其他型号名称，或“不限型号”
  - type: dropdown
    id: adr
    attributes:
      label: 是否与现有架构决策（ADR）冲突 / Does it touch an existing ADR?
      description: 若建议改变某条 ADR 的决定，请在下方补充说明是哪一条以及为什么需要重新讨论。
      options:
        - 不涉及 ADR / No ADR involved
        - 涉及或可能推翻某条 ADR / Touches or may reopen an ADR
        - 不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: adr-details
    attributes:
      label: 相关 ADR 与理由 / Related ADRs and rationale
      description: 例如“ADR 0014：……”。不涉及可留空。
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、官方 RoseLink 的对应行为、协议资料等。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索过现有 Issue，没有找到重复
          required: true
